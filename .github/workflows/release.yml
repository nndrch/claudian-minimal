name: Release

# Push a tag that matches the version in manifest.json (for example 1.0.0,
# no "v") to create a draft release with the three plugin files.
on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  # For the build provenance attestation below.
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches manifest.json
        run: |
          version="$(jq -r .version manifest.json)"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match manifest.json version $version" >&2
            exit 1
          fi
          jq -e --arg v "$version" 'has($v)' versions.json > /dev/null || {
            echo "versions.json has no entry for $version" >&2
            exit 1
          }

      # Lets anyone check the release files came from this repo:
      # gh attestation verify main.js --repo nndrch/claudian-minimal
      - name: Attest the plugin files
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      # The notes list the pull requests merged since the last release.
      # Edit them in the draft before publishing.
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --draft \
            --generate-notes \
            main.js manifest.json styles.css
