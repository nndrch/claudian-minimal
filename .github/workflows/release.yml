name: Release

# Two kinds of tag, both without a "v":
#
# - A version that matches manifest.json (for example 1.0.0) creates a draft
#   release with the three plugin files. Publish it by hand.
# - A release candidate (for example 1.1.0-rc.1) publishes a GitHub
#   pre-release straight away, for testing before the real release. It is never
#   "latest", so Obsidian's directory doesn't offer it to anyone. manifest.json
#   on main isn't touched: the build gets the candidate's version, so Obsidian
#   shows it in Settings and a later real release counts as an update.
on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  # For the build provenance attestation below.
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Detect a release candidate
        run: |
          case "$GITHUB_REF_NAME" in
            *-rc.*) echo "RC=true" >> "$GITHUB_ENV" ;;
            *) echo "RC=false" >> "$GITHUB_ENV" ;;
          esac

      - name: Check the tag matches manifest.json
        if: env.RC != 'true'
        run: |
          version="$(jq -r .version manifest.json)"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match manifest.json version $version" >&2
            exit 1
          fi
          jq -e --arg v "$version" 'has($v)' versions.json > /dev/null || {
            echo "versions.json has no entry for $version" >&2
            exit 1
          }

      # The candidate's tag must be the next version plus -rc.N, and must not
      # be a version that is already released.
      - name: Give the candidate its version
        if: env.RC == 'true'
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
            echo "Tag $GITHUB_REF_NAME must look like 1.2.3-rc.1" >&2
            exit 1
          fi
          jq -e --arg v "${GITHUB_REF_NAME%-rc.*}" 'has($v)' versions.json > /dev/null && {
            echo "${GITHUB_REF_NAME%-rc.*} is already released: use the next version" >&2
            exit 1
          }
          jq --arg v "$GITHUB_REF_NAME" '.version = $v' manifest.json > manifest.rc.json
          mv manifest.rc.json manifest.json

      # Lets anyone check the release files came from this repo:
      # gh attestation verify main.js --repo nndrch/claudian-minimal
      - name: Attest the plugin files
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      # The notes list the pull requests merged since the last release.
      # Edit them in the draft before publishing.
      - name: Create a draft release
        if: env.RC != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --draft \
            --generate-notes \
            main.js manifest.json styles.css

      # Published at once (not a draft) so the files can be downloaded to test.
      - name: Publish a pre-release
        if: env.RC == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --prerelease \
            --generate-notes \
            main.js manifest.json styles.css
